<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#070914">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="茶封筒er2">
    <title>茶封筒erファイター2</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="game" data-game-root aria-label="茶封筒erファイター2">
      <section class="cabinet">
        <header class="brand">CHABUTO RECORDS <span>ER-02</span></header>
        <div class="lcd">
          <div class="playfield-header">
            <button type="button" class="header-pause" data-header-pause aria-label="Pause battle" disabled>PAUSE</button>
          </div>
          <canvas id="arena" width="480" height="270" aria-label="480 by 270 battle arena"></canvas>
          <section id="panel" data-panel aria-live="polite"></section>
          <p id="hint" data-hint></p>
        </div>
        <div class="virtual-pad-slot" data-virtual-pad aria-label="virtual controls"></div>
      </section>
    </main>
    <script type="module" src="./src/pwa.js"></script>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
