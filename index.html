<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#070914">
    <title>茶封筒erファイター2</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="game" aria-label="茶封筒erファイター2">
      <section class="cabinet">
        <header class="brand">CHABUTO RECORDS <span>ER-02</span></header>
        <div class="lcd">
          <canvas id="arena" width="480" height="270" aria-label="480 by 270 battle arena"></canvas>
          <section id="panel" data-panel aria-live="polite"></section>
          <p id="hint" data-hint></p>
        </div>
        <footer class="controls" aria-label="keyboard controls">
          <span class="dpad">← ↑ ↓ →</span>
          <span class="buttons"><b>J</b> light <b>K</b> strong <b>L</b> guard <b>I</b> special</span>
          <span class="system">ENTER start · ESC pause</span>
        </footer>
      </section>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
